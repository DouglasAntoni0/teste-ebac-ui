name: CI - Rodar Testes e Publicar Relatório

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  rodar-testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Executar testes
        run: npx cypress run
      - name: Guardar relatório
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-mochawesome
          path: cypress/reports/html
          retention-days: 5
          if-no-files-found: warn
  deploy-pages:
    if: ${{ always() && needs.rodar-testes.result != 'cancelled' }}
    needs: rodar-testes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/configure-pages@v4
      - uses: actions/download-artifact@v4
        with:
          name: relatorio-mochawesome
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - uses: actions/deploy-pages@v4
